# tokusage 配置示例 — 复制为 config.toml 后按需修改
# 用法：采集器在每台主机上运行一条命令，命令向 stdout 输出 JSONL（每行一个 JSON 对象）。
# 记录字段见 README.md 的「记录格式」一节。

[server]
host = "127.0.0.1"
port = 8080
collect_interval = 60     # 采集轮次间隔（秒）
refresh_interval = 10     # 网页自动刷新间隔（秒）

[collection]
timeout = 30              # 每条命令 / 每次 ssh 允许的最长时间（秒）

[store]
path = "usage.db"         # SQLite 文件，存放采集到的历史（相对于本配置文件所在目录）

# 本机采集。command 为空即禁用本机采集。
# collect_agents.py 会读取本机的 codex / omp / claude code 目录并输出 JSONL。
[local]
enabled = true
name = "local"
command = 'python "C:/path/to/tokusage/collect_agents.py"'   # 改成实际路径

# 远端 Linux 主机（通过 SSH 密钥免密访问）。
# address 填 IP/域名，或 ~/.ssh/config 里的 Host 别名；留空回退到 name。
# 用 `python tokusage.py --deploy` 自动把 collect_agents.py 拷到各主机 ~/tokusage/ 并装好 pyzstd。
# 注意：key 用正斜杠路径（TOML 里反斜杠是转义符）。
[[hosts]]
name = "gpu-1"
address = "192.168.1.10"
user = "your-user"
# port = 22
# key = "C:/Users/you/.ssh/id_ed25519"
command = "python3 ~/tokusage/collect_agents.py"
